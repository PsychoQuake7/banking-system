{% extends "base.html" %}
{% load i18n %}
{% load account %}

{% block title %}{% trans "Password Changed" %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0"><i class="fas fa-check-circle me-2"></i>{% trans "Password Changed" %}</h4>
            </div>
            <div class="card-body p-4 text-center">
                <div class="mb-4">
                    <i class="fas fa-check-circle fa-4x text-success"></i>
                </div>

                <p class="lead">{% trans "Your password has been changed." %}</p>

                <div class="mt-4">
                    <a href="{% url 'account_login' %}" class="btn btn-primary">{% trans "Log In" %}</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
