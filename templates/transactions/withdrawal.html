{% extends "base.html" %}

{% block title %}Make Withdrawal - Kayamanan Bank{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0"><i class="fas fa-minus-circle me-2"></i>Make Withdrawal</h4>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="account" class="form-label">Select Account</label>
                        <select class="form-select" id="account" name="account" required>
                            <option value="">Choose an account...</option>
                            {% for acc in accounts %}
                            <option value="{{ acc.account_id }}">
                                {{ acc.account_number }} - {{ acc.get_account_type_display }} (Balance: ₱{{
                                acc.current_balance }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="amount" class="form-label">Amount (₱)</label>
                        <input type="number" class="form-control" id="amount" name="amount" min="1" step="0.01"
                            required>
                        <div class="form-text">Make sure you have sufficient balance in your account.</div>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description (Optional)</label>
                        <textarea class="form-control" id="description" name="description" rows="2"
                            placeholder="Enter description..."></textarea>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{% url 'dashboard' %}" class="btn btn-secondary me-md-2">Cancel</a>
                        <button type="submit" class="btn btn-warning">
                            <i class="fas fa-minus me-2"></i>Make Withdrawal
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
